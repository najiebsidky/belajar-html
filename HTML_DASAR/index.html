<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Najieb Sidky Asyhari</title>
  </head>
  <body>
    <h1 id="sapa">Halo WORLD</h1>
    <script>
      <!-- ambil parameter URL-->
      const p = URLSearchParams(location.search);
      const nama = p.get("nama") || "tamu";
      document.querySelector("#sapa").textContent = `Halo,${nama}`;
    </script>
  </body>
</html>
